// ═══════════════════════════════════════════════════════
// BANCO DE DADOS (localStorage)
// ═══════════════════════════════════════════════════════
const DB_KEY = 'obs_smm_data';

function dbLoad() {
  try { return JSON.parse(localStorage.getItem(DB_KEY)) || { nextId:6, obs:[] }; }
  catch { return { nextId:6, obs:[] }; }
}
function dbSave(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); }

function dbSeed() {
  const data = dbLoad();
  if (data.obs.length > 0) return;
  const now = new Date().toISOString();
  SEEDS.forEach((s, i) => {
    data.obs.push({ id: i+1, ...s, criado_em: now, atualizado_em: now });
  });
  data.nextId = SEEDS.length + 1;
  dbSave(data);
}

function dbMedia(o) {
  const soma = CRITERIOS.reduce((a, c) => a + (Number(o[c.campo]) || 0), 0);
  return Math.round((soma / CRITERIOS.length) * 100) / 100;
}

const DB = {
  getAll(filtros = {}) {
    let rows = dbLoad().obs;
    if (filtros.unidade)     rows = rows.filter(r => r.unidade === filtros.unidade);
    if (filtros.professor)   rows = rows.filter(r => r.professor.toLowerCase().includes(filtros.professor.toLowerCase()));
    if (filtros.turma)       rows = rows.filter(r => r.turma.toLowerCase().includes(filtros.turma.toLowerCase()));
    if (filtros.data_inicio) rows = rows.filter(r => r.data_observacao >= filtros.data_inicio);
    if (filtros.data_fim)    rows = rows.filter(r => r.data_observacao <= filtros.data_fim);
    rows.sort((a, b) => b.data_observacao.localeCompare(a.data_observacao) || b.id - a.id);
    return rows.map(r => ({ ...r, media: dbMedia(r) }));
  },
  getById(id) {
    const o = dbLoad().obs.find(r => r.id === Number(id));
    return o ? { ...o, media: dbMedia(o) } : null;
  },
  create(obs) {
    const data = dbLoad();
    const now = new Date().toISOString();
    const record = { id: data.nextId++, ...obs, criado_em: now, atualizado_em: now };
    data.obs.push(record);
    dbSave(data);
    return { ...record, media: dbMedia(record) };
  },
  update(id, obs) {
    const data = dbLoad();
    const idx = data.obs.findIndex(r => r.id === Number(id));
    if (idx === -1) return null;
    data.obs[idx] = { ...data.obs[idx], ...obs, id: Number(id), atualizado_em: new Date().toISOString() };
    dbSave(data);
    return { ...data.obs[idx], media: dbMedia(data.obs[idx]) };
  },
  delete(id) {
    const data = dbLoad();
    data.obs = data.obs.filter(r => r.id !== Number(id));
    dbSave(data);
  },
  stats() {
    const obs = dbLoad().obs;
    const total = obs.length;
    const professores = new Set(obs.map(o => o.professor)).size;
    const unidadeCount = {};
    obs.forEach(o => { unidadeCount[o.unidade] = (unidadeCount[o.unidade] || 0) + 1; });
    const unidadeMaisAtiva = Object.entries(unidadeCount).sort((a,b) => b[1]-a[1])[0];
    const mediasGlobais = CRITERIOS.map(c => {
      const vals = obs.map(o => Number(o[c.campo])).filter(Boolean);
      const avg = vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
      return { campo: c.campo, titulo: c.titulo, media: Math.round(avg * 100) / 100 };
    });
    const porCriterio = {};
    CRITERIOS.forEach(c => {
      porCriterio[c.campo] = {1:0, 2:0, 3:0, 4:0};
      obs.forEach(o => { const v = Number(o[c.campo]); if (v >= 1 && v <= 4) porCriterio[c.campo][v]++; });
    });
    return { total, professores, unidadeMaisAtiva: unidadeMaisAtiva ? { unidade: unidadeMaisAtiva[0], count: unidadeMaisAtiva[1] } : null, mediasGlobais, porCriterio };
  }
};

function today() { return new Date().toISOString().slice(0,10); }
function escalaLabel(n) { return ESCALA[n] || ''; }
function mediaColor(m) { if(m>=3.5) return 'text-emerald-600'; if(m>=2.5) return 'text-blue-600'; if(m>=1.5) return 'text-amber-500'; return 'text-red-500'; }

function toast(msg, type='success') {
  const t=document.createElement('div');
  t.className=`toast ${type==='success'?'bg-emerald-600':type==='error'?'bg-red-600':'bg-blue-600'}`;
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}

                    <div class="text-xs text-slate-500">${u.cargo} · ${u.unidade}</div>
                  </div>
                </button>`).join('')}
            </div>
          </div>
        </div>
        <p class="text-center text-slate-500 text-xs mt-6">Senha para todos os usuários demo: <strong class="text-slate-300">demo123</strong></p>
      </div>
    </div>`;

  $('login-form').onsubmit = e => {
    e.preventDefault();
    const email=$('login-email').value, senha=$('login-senha').value;
    const u=DEMO_USERS.find(u=>u.email===email&&u.senha===senha);
    if(!u){ const err=$('login-error'); err.textContent='Credenciais inválidas.'; err.classList.remove('hidden'); return; }
    state.user=u; navigate('dashboard');
  };
}

function autoLogin(email) {
  $('login-email').value=email; $('login-senha').value='demo123';
  $('login-form').dispatchEvent(new Event('submit'));
}

        <h3 class="font-semibold text-slate-700 text-base mb-4">Revisão e Confirmação</h3>
        <div class="bg-slate-50 rounded-lg p-4 mb-5 grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm">
          <div><span class="text-slate-400 text-xs block">Unidade</span><span class="font-medium text-slate-700">${fd.unidade}</span></div>
          <div><span class="text-slate-400 text-xs block">Data</span><span class="font-medium text-slate-700">${fmt(fd.data_observacao)}</span></div>
          <div><span class="text-slate-400 text-xs block">Horário</span><span class="font-medium text-slate-700">${fd.horario}</span></div>
          <div><span class="text-slate-400 text-xs block">Professor(a)</span><span class="font-medium text-slate-700">${fd.professor}</span></div>
          <div><span class="text-slate-400 text-xs block">Turma</span><span class="font-medium text-slate-700">${fd.turma}</span></div>

          ${CRITERIOS.map((c,i)=>`
            <div class="flex items-center gap-2 text-sm py-1.5 border-b border-slate-50">
              <span class="text-xs font-bold text-blue-600 w-5 flex-shrink-0">${i+1}</span>

              <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${fd[c.campo]==4?'bg-emerald-50 text-emerald-700':fd[c.campo]==3?'bg-blue-50 text-blue-700':fd[c.campo]==2?'bg-amber-50 text-amber-700':'bg-red-50 text-red-700'}">${escalaLabel(parseInt(fd[c.campo]))}</span>
            </div>`).join('')}
        </div>
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-5">
          <span class="text-sm font-semibold text-blue-800">Média geral: <strong>${mediaVal.toFixed(2)}/4,00</strong></span>
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-1">Feedback e observações qualitativas</label>
          <textarea id="f-feedback" rows="5" placeholder="Pontos fortes, sugestões de melhoria…" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none">${fd.feedback||''}</textarea>
        </div>
        <div id="step3-error" class="text-red-600 text-sm hidden mb-3"></div>
        <div class="flex justify-between pt-2 border-t border-slate-100">
          <button onclick="prevStep()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium rounded-lg transition-colors">← Voltar</button>
          <button onclick="submitForm(${editData?.id||'null'})" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg transition-colors">
            ${editData?'Salvar alterações':'✓ Salvar observação'}
          </button>

      </div>`;
  }
}

function nextStep() {
  if(state.formStep===1) {
    const u=$('f-unidade-form')?.value, d=$('f-data')?.value, h=$('f-horario')?.value?.trim(), p=$('f-professor-form')?.value?.trim(), t=$('f-turma-form')?.value?.trim(), o=$('f-observador')?.value?.trim();
    const err=$('step1-error');
    if(!u||!d||!h||!p||!t||!o){ err.textContent='Preencha todos os campos obrigatórios.'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    Object.assign(state.formData,{unidade:u,data_observacao:d,horario:h,professor:p,turma:t,observador:o});
    state.formStep=2;
  } else if(state.formStep===2) {
    const missing=CRITERIOS.filter(c=>!document.querySelector(`input[name="${c.campo}"]:checked`));
    if(missing.length){ $('step2-error').textContent=`Responda todos os critérios. Faltam: ${missing.length}.`; $('step2-error').classList.remove('hidden'); return; }
    CRITERIOS.forEach(c=>{ state.formData[c.campo]=parseInt(document.querySelector(`input[name="${c.campo}"]:checked`).value); });
    state.formStep=3;
  }
  renderFormStep();
}
function prevStep() {
  if(state.formStep===3) state.formData.feedback=$('f-feedback')?.value||'';
  if(state.formStep>1){ state.formStep--; renderFormStep(); }
}
function submitForm(editId=null) {
  state.formData.feedback=$('f-feedback')?.value||'';
  try {
    if(editId) { DB.update(editId,state.formData); toast('Observação atualizada!'); }
    else { DB.create(state.formData); toast('Observação salva com sucesso!'); }
    state.formData={}; state.formStep=1; navigate('dashboard');
  } catch(e){ $('step3-error').textContent=e.message; $('step3-error').classList.remove('hidden'); }
}

  return renderForm(o);
}
function startEdit(id) { state.selectedObs=DB.getById(id); state.formData={...state.selectedObs,_loaded:true}; state.formStep=1; state.view='edit'; render(); }

// ═══════════════════════════════════════════════════════
// PDF (jsPDF + autotable — formato tabela do docx)
// ═══════════════════════════════════════════════════════
function exportPDF(id) {
  const o = DB.getById(id);
  if (!o) { toast('Observação não encontrada.','error'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

  const PW = 210, ML = 12, MR = 12, TW = PW - ML - MR;
  let y = 12;

  // ── 1. Header navy ────────────────────────────────────
  doc.setFillColor(15,23,42);
  doc.rect(ML, y, TW, 18, 'F');
  doc.setFont('helvetica','normal');
  doc.setFontSize(7); doc.setTextColor(148,163,184);
  doc.text('COLÉGIO SANTA MARIA MINAS', ML+3, y+5);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12); doc.setTextColor(255,255,255);
  doc.text('OBSERVAÇÃO DE AULAS', ML+3, y+12);
  doc.setFont('helvetica','normal');
  doc.setFontSize(7); doc.setTextColor(147,197,253);
  doc.text(o.unidade, PW-MR-3, y+14, {align:'right'});
  y += 21;

  // ── 2. Identificação (3 células) ─────────────────────
  const dataFmt = o.data_observacao ? o.data_observacao.split('-').reverse().join('/') : '';
  const idH = 11;

  // bordas pretas
  doc.setDrawColor(0,0,0); doc.setLineWidth(0.2);

  // Professor (45%)
  const w1 = TW*0.45, w2 = TW*0.30, w3 = TW - w1 - w2;
  doc.setFillColor(255,255,255); doc.rect(ML,      y, w1, idH,'FD');
  doc.setFillColor(255,255,255); doc.rect(ML+w1,   y, w2, idH,'FD');
  doc.setFillColor(255,255,255); doc.rect(ML+w1+w2,y, w3, idH,'FD');

  doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(107,114,128);
  doc.text('PROFESSOR(A):', ML+2, y+3.5);
  doc.text('HORÁRIO / DATA:', ML+w1+2, y+3.5);
  doc.text('TURMA:', ML+w1+w2+2, y+3.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(17,17,17);
  doc.text(o.professor||'', ML+2, y+8.5, {maxWidth:w1-4});
  doc.text(`${o.horario||''}  |  ${dataFmt}`, ML+w1+2, y+8.5, {maxWidth:w2-4});
  doc.text(o.turma||'', ML+w1+w2+2, y+8.5, {maxWidth:w3-4});
  y += idH;

  // Observador (linha completa)
  doc.setFillColor(255,255,255); doc.rect(ML, y, TW, idH,'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(107,114,128);
  doc.text('OBSERVADOR(A):', ML+2, y+3.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(17,17,17);
  doc.text(o.observador||'', ML+34, y+8.5, {maxWidth:TW-36});
  y += idH;

  // ── 3. Tabela de critérios ────────────────────────────
  const escalaLabels = ['Nada\nEvidente','Pouco\nEvidente','Evidente','Muito\nEvidente'];
  const colCrit = TW * 0.50;
  const colE    = (TW * 0.50) / 4;

  // Cabeçalho da tabela
  const thH = 10;
  doc.setFillColor(30,58,95); doc.rect(ML, y, colCrit, thH,'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(255,255,255);
  doc.text('CRITÉRIO', ML + colCrit/2, y+6.5, {align:'center'});

  escalaLabels.forEach((lbl,i)=>{
    const cx = ML + colCrit + i*colE;
    doc.setFillColor(30,58,95); doc.rect(cx, y, colE, thH,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(5.5); doc.setTextColor(255,255,255);
    const lines = lbl.split('\n');
    if(lines.length===2){ doc.text(lines[0], cx+colE/2, y+4, {align:'center'}); doc.text(lines[1], cx+colE/2, y+7.5, {align:'center'}); }
    else { doc.text(lbl, cx+colE/2, y+6, {align:'center'}); }
  });
  y += thH;

  // Linhas de critérios
  CRITERIOS.forEach((c,idx)=>{
    // Medir altura necessária para o texto
    doc.setFont('helvetica','bold'); doc.setFontSize(7);
    const titleLines = doc.splitTextToSize(c.titulo, colCrit-6);
    doc.setFont('helvetica','normal'); doc.setFontSize(7);
    const textoLines = doc.splitTextToSize(c.texto, colCrit-6);
    const rowH = Math.max(((titleLines.length + textoLines.length) * 3.5) + 5, 14);

    // Quebra de página
    if(y + rowH > 280){ doc.addPage(); y = 12; }

    // Célula critério
    doc.setFillColor(255,255,255); doc.rect(ML, y, colCrit, rowH,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(30,58,95);
    doc.text(titleLines, ML+3, y+4);
    const titleH2 = titleLines.length * 3.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(55,65,81);
    doc.text(textoLines, ML+3, y+4+titleH2+1);

    // 4 células de escala
    const valor = Number(o[c.campo]);
    escalaLabels.forEach((_,i)=>{
      const cx = ML + colCrit + i*colE;
      doc.setFillColor(255,255,255); doc.rect(cx, y, colE, rowH,'FD');
      if(valor === i+1){
        doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(30,58,95);
        doc.text('X', cx + colE/2, y + rowH/2 + 3, {align:'center'});
      }
    });
    y += rowH;
  });

  // ── 4. Média geral ────────────────────────────────────
  if(y+9>280){ doc.addPage(); y=12; }
  const media=dbMedia(o);
  doc.setFillColor(255,255,255); doc.rect(ML, y, TW, 9,'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(30,58,95);
  doc.text(`MÉDIA GERAL: ${media.toFixed(2)} / 4,00   —   ${mediaLabel(media)}`, ML+TW/2, y+6, {align:'center'});
  y += 11;

  // ── 5. Feedback ───────────────────────────────────────
  if(o.feedback && o.feedback.trim()){
    if(y+6>280){ doc.addPage(); y=12; }
    doc.setFillColor(30,58,95); doc.rect(ML, y, TW, 6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(255,255,255);
    doc.text('FEEDBACK', ML+3, y+4.5);
    y += 6;

    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(55,65,81);
    const fbLines = doc.splitTextToSize(o.feedback, TW-8);
    const fbH = Math.max(fbLines.length*4+6, 18);
    if(y+fbH>280){ doc.addPage(); y=12; }
    doc.setFillColor(255,255,255); doc.rect(ML, y, TW, fbH,'FD');
    doc.text(fbLines, ML+4, y+5);
    y += fbH + 6;
  }

  // ── 6. Rodapé ─────────────────────────────────────────
  if(y+12>280){ doc.addPage(); y=12; }
  y += 4;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(30,58,95);
  doc.text('Coordenador(a) de Formação – Pedagógica', ML+TW/2, y, {align:'center'});
  y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(100,116,139);
  doc.text(`Colégio Santa Maria Minas  —  ${o.unidade}`, ML+TW/2, y, {align:'center'});
  y += 6;
  const nowStr = new Date().toLocaleString('pt-BR');
  doc.setFontSize(6); doc.setTextColor(156,163,175);
  doc.text(`Gerado em ${nowStr} · Sistema de Observação de Aula — Colégio Santa Maria Minas`, ML+TW/2, y, {align:'center'});

  doc.save(`observacao-${o.id}-${o.professor.split(' ')[0]}.pdf`);
  toast('PDF gerado com sucesso!');
}

</script>
